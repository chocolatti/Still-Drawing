<!DOCTYPE html>
<html>
    <head>
        <title>Still Life Drawing</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
    <div class="table"></div>
    <div class="bag">
        <div class="bag-handle"></div>
    </div>
    <div class="book">
        <div class="book-spine">
            MRS. SHIM 
            IS A KILLER
        </div>

        <div class="book-cover">
            <div class="book-title">
                MRS. SHIM <br>
                <span>IS <br> A</span> 
                <span class="killer">KILLER</span>
            
            <div class="book-koreantitle">심어사는 킬러</div>
            <div class="book-tunnel"></div>
                <div class="person">
                    <div class="person-head"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="bowl">
        <div class="bowl-inner"></div>
        <div class="bowl-rim"></div>
        <div class="bowl-ridges"></div>
    </div>

    <div class="camera">
        <div class="camera-cap"></div>
        <div class="camera-label">gutedama</div>
        <div class="camera-lens"></div>
    </div>

    <div class="plush">
        <div class="plush-left-eye"></div>
        <div class="plush-right-eye"></div>
        <div class="plush-mouth"></div>
        <div class="plush-stick"></div>
        <div class="plush-leaf"></div>
    </div>

    <div class="case">
        <div class="case-top"></div>
        <div class="case-line"></div>
    </div>

    <div class="scrunchie"></div>
    </body>
</html>
